[package]
name = "audible"
version = "0.1.0"
description = "Audible: voice-to-text dictation for macOS"
authors = ["Ken Nguyen"]
edition = "2021"
default-run = "audible"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "audible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true

# Debug builds of these are too slow to use: transcribe-cpp's C++ (cmake picks
# RelWithDebInfo from opt-level 3), sha256 over the 1.5 GB model, and the
# resampler FFT.
[profile.dev.package.transcribe-cpp-sys]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2.7.1"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-single-instance = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.25"
once_cell = "1"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"
keyring = { version = "3.6", features = ["apple-native"] }
security-framework = "3"
anyhow = "1.0.95"
cpal = "0.16.0"
rtrb = "0.4.0"
rubato = "0.16.2"
rustfft = "6.4.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
transcribe-cpp = { version = "0.2.3", default-features = false, features = ["metal"] }
whatlang = "0.16"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1.43.0", features = ["macros", "time", "rt"] }
tokio-util = "0.7"
libc = "0.2"
handy-keys = "0.3.4"
regex = "1"
strsim = "0.11.0"
unicode-normalization = "0.1"
enigo = "0.6.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904" }

[dev-dependencies]
tempfile = "3"
hound = "3.5.1"
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "time", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
