[package]
name = "audible"
version = "0.1.0"
description = "Audible: voice-to-text dictation for macOS"
authors = ["Ken Nguyen"]
edition = "2021"
default-run = "audible"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "audible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2.7.1"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-single-instance = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.25"
once_cell = "1"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
